<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Matte Swiss Obsidian Base -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#111110" />

  <!-- Subtle Inner Drafting Grid -->
  <path d="M2 22H62M2 42H62M22 2V62M42 2V62" stroke="#f4f3f0" stroke-opacity="0.06" stroke-width="1" />

  <!-- Outer Hairline Frame -->
  <rect x="3" y="3" width="58" height="58" rx="12" stroke="#f4f3f0" stroke-opacity="0.2" stroke-width="1.25" />

  <!-- Animated Perimeter Signal Trace (SMIL for SVG Favicon support) -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="12"
    stroke="#3b82f6"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-dasharray="36 196"
  >
    <animate
      attributeName="stroke-dashoffset"
      values="232;0"
      dur="4.5s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- 4 Corner CAD Registration Brackets -->
  <path d="M8 14V9.5C8 8.67 8.67 8 9.5 8H14" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="square" />
  <path d="M50 8H54.5C55.33 8 56 8.67 56 9.5V14" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="square" />
  <path d="M8 50V54.5C8 55.33 8.67 56 9.5 56H14" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="square" />
  <path d="M56 50V54.5C56 55.33 55.33 56 54.5 56H50" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="square" />

  <!-- Precision Vector 'T' -->
  <path
    d="M13 21H29M21 21V44"
    stroke="#f4f3f0"
    stroke-width="4.2"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Precision Vector 'A' (Architectural Apex) -->
  <path
    d="M32 44L41 21L50 44"
    stroke="#f4f3f0"
    stroke-width="4.2"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Animated Accent Crossbar / Cursor Node inside 'A' -->
  <path
    d="M35.5 36H46.5"
    stroke="#3b82f6"
    stroke-width="3.6"
    stroke-linecap="square"
  >
    <animate
      attributeName="stroke-opacity"
      values="1;0.45;1"
      dur="2.4s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Live Telemetry Status Dot -->
  <circle cx="50" cy="14" r="2.3" fill="#10b981">
    <animate
      attributeName="r"
      values="2.1;3.1;2.1"
      dur="2s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
